oft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">驗算：土粒 93.6 g，排水 19.0 g → Δw = 19.0/93.6 = 20.29% ✓</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>