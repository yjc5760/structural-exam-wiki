<svg xmlns="http://www.w3.org/2000/svg" width="900" height="642" viewBox="0 0 900 642" xmlns:c2pa="http://c2pa.org/manifest"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="900" height="520"/></clipPath></defs><rect width="900" height="642" fill="#FFFFFF"/><text x="450.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">SM-2024-2 ㈢ 自由水層的水力坡降</text><text x="450.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">流線平行自由水面（與水平夾 θ），水頭損失沿流線量測</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="900" height="520" fill="#FFFFFF"/><line x1="659.47" y1="78.42" x2="156.27" y2="368.95" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><line x1="683.68" y1="120.35" x2="180.48" y2="410.88" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="8 5" opacity="1.0"/><line x1="707.89" y1="162.29" x2="204.69" y2="452.82" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="8 5" opacity="1.0"/><line x1="732.11" y1="204.22" x2="228.90" y2="494.75" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="8 5" opacity="1.0"/><line x1="575.61" y1="126.84" x2="648.24" y2="252.64" stroke="#2E7D6F" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="449.80" y1="199.47" x2="522.44" y2="325.28" stroke="#2E7D6F" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="324.00" y1="272.11" x2="396.63" y2="397.91" stroke="#2E7D6F" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="198.20" y1="344.74" x2="270.83" y2="470.54" stroke="#2E7D6F" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><text x="617.54" y="88.63" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">自由水面（u = 0）＝最上一條流線</text><text x="264.83" y="484.54" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="400">等勢線 ⊥ 流線</text><line x1="449.80" y1="199.47" x2="332.66" y2="267.11" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="324.00,272.11 330.36,263.12 334.96,271.09" fill="#C0392B"/><text x="382.90" y="219.79" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">Δs（沿流線，水由右上往左下流）</text><line x1="324.00" y1="272.11" x2="449.80" y2="272.11" stroke="#8A94A6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><line x1="449.80" y1="199.47" x2="449.80" y2="272.11" stroke="#8A94A6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><text x="457.80" y="235.79" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">Δz = Δs sinθ</text><text x="386.90" y="288.11" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">Δx = Δs cosθ</text><text x="368.00" y="263.11" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">θ = 30°</text><text x="54.21" y="59.05" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">自由水面上 h = z（壓力水頭 0）→ Δh = Δz = Δs sinθ</text><text x="54.21" y="92.95" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">i = Δh / Δs = sin 30° = 0.50</text><text x="54.21" y="126.84" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">對照：Dupuit（流線水平）i = tanθ = 0.577，不合題意「與水平夾 θ 流動」</text></g><text x="450.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">攔錯用：分母是沿流線的 Δs（i = sinθ），不是水平距離（tanθ）；也不是坡角 β = 42°。</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>