</tspan></text><text x="249.59" y="350.07" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">黏土塞重 W = T·γ = 96.22 kPa</text><text x="658.38" y="144.32" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">檢核結果（本解 §4、§5）</text><text x="658.38" y="191.62" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">抗隆起 Terzaghi 形式</text><text x="658.38" y="213.62" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = 2.58</text><text x="658.38" y="259.19" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">抗隆起 Bjerrum–Eide</text><text x="658.38" y="281.19" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = 2.13</text><text x="658.38" y="326.76" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">抗上舉 W / U</text><text x="658.38" y="348.76" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = 1.09</text><text x="658.38" y="414.59" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">隆起各法 2.1～3.2 皆可；</text><text x="658.38" y="434.59" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">上舉 FS 低於 1.2 → 砂層需降壓</text></g><text x="490.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">數值取自本題 §4、§5（Df = 6.34 m）。攔錯用：破壞塊深度受砂層限制（T 與 B/√2 比較）；只算剪力隆起而漏掉砂層水壓造成的上舉。</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>