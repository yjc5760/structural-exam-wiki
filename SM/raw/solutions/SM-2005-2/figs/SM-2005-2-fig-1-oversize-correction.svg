s CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">細料乾重 650 ÷ 1.112 = 584.53 g</text><text x="750.00" y="300.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">通過 #4 試樣乾密度</text><text x="750.00" y="340.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">正解：細料乾重 ÷ 細料體積</text><text x="750.00" y="362.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400">584.53 / 281.06 = 2.080 g/cm³</text><text x="750.00" y="398.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">錯：只扣重量、不扣體積</text><text x="750.00" y="420.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">584.53 / 315 = 1.856</text><text x="750.00" y="456.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">錯：全試樣乾密度（非所求）</text><text x="750.00" y="478.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">664.42 / 315 = 2.109</text><text x="490.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　工地密度試驗的過大顆粒修正：從洞體積扣掉粗顆粒「實體積」</text><text x="234.04" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">高度依實際體積等比繪製（1 cm³ = 1.45 px）；粗顆粒視為無孔隙實體，體積 = 乾重 ÷ (G·ρ<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5">)</tspan></text><text x="490.00" y="704.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">攔錯用：所求是「通過 #4 試樣」的乾密度，分子分母都只能留細料——</text><text x="490.00" y="728.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">扣了粗粒重量卻沒扣它佔的 33.9 cm³，會低估 11%（1.856）；整包一起算則是另一個量（2.109）。</text><text x="490.00" y="760.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">驗算：粗粒體積 7.301 + 10.766 + 15.878 = 33.945 cm³；315 − 33.945 = 281.055 cm³ ✓</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>