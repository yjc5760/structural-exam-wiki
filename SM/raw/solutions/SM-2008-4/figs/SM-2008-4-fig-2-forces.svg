<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="592" viewBox="0 0 1040 592" xmlns:c2pa="http://c2pa.org/manifest"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1040" height="470"/></clipPath></defs><rect width="1040" height="592" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">SM-2008-4 平面滑動：重量與地震力沿滑動面 AC 分解</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">Kh 取向坡外：增加驅動、減少正向力；地錨垂直 AC 只增加正向力</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="1040" height="470" fill="#FFFFFF"/><polygon points="300.05,371.99 381.96,146.95 589.92,128.75" fill="rgba(180,83,9,0.16)" stroke="#3F4A5A" stroke-width="2.4" opacity="1.0"/><line x1="45.00" y1="371.99" x2="300.05" y2="371.99" stroke="#3F4A5A" stroke-width="2.2" stroke-linecap="round" opacity="1.0"/><circle cx="423.98" cy="215.89" r="4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><line x1="423.98" y1="215.89" x2="423.98" y2="302.53" stroke="#1F2733" stroke-width="3.0" stroke-linecap="round"/><polygon points="423.98,312.53 419.38,302.53 428.58,302.53" fill="#1F2733"/><text x="429.98" y="316.53" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">W = 503.2</text><line x1="423.98" y1="215.89" x2="414.65" y2="215.89" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round"/><polygon points="404.65,215.89 414.65,211.29 414.65,220.49" fill="#C0392B"/><text x="398.65" y="203.89" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">KhW = 100.7（向坡外）</text><line x1="300.05" y1="371.99" x2="589.92" y2="128.75" stroke="#3F4A5A" stroke-width="2.4" stroke-linecap="round" opacity="1.0"/><line x1="598.59" y1="156.73" x2="547.32" y2="199.75" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="539.66,206.18 544.36,196.23 550.28,203.28" fill="#C0392B"/><text x="606.59" y="160.73" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">驅動 = W sin40° + KhW cos40° = 400.6</text><line x1="406.25" y1="369.04" x2="442.24" y2="338.85" stroke="#2E7D6F" stroke-width="3.2" stroke-linecap="round"/><polygon points="449.90,332.42 445.19,342.37 439.28,335.32" fill="#2E7D6F"/><text x="398.25" y="379.04" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">抗滑 = cL + N tan28° = 126.1 + 170.6 = 296.7</text><line x1="519.37" y1="268.37" x2="486.20" y2="228.84" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="479.77,221.18 489.72,225.88 482.68,231.80" fill="#1D4ED8"/><text x="527.37" y="276.37" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">N = W cos40° − KhW sin40° = 320.8</text><line x1="389.86" y1="72.24" x2="441.29" y2="133.53" stroke="#B45309" stroke-width="3.0" stroke-linecap="round"/><polygon points="447.72,141.19 437.77,136.49 444.81,130.58" fill="#B45309"/><text x="383.86" y="62.24" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">㈡ 地錨 T/2 = 346.1 kN/m（垂直 AC）</text><text x="288.05" y="359.98" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">A</text><text x="372.95" y="134.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">B</text><text x="589.92" y="149.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">C</text><text x="634.93" y="56.74" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">㈠ FS = 296.7 / 400.6 = 0.74</text><text x="634.93" y="86.74" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">㈡ 1.2 × 400.6 = 296.7 + (T/2) tan28°</text><text x="634.93" y="113.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">→ T = 692 kN／支（間距 2 m）</text><text x="634.93" y="140.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">AC = 12.61 m，單位 kN/m</text></g><text x="520.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">攔錯用：KhW sin40° 要從 N 扣掉（不是加）；每公尺所需 346 kN 乘間距 2 m 才是每支荷重 692 kN。</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>