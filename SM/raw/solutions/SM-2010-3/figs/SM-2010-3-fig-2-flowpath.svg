<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="762" viewBox="0 0 1100 762" xmlns:c2pa="http://c2pa.org/manifest"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1100" height="640"/></clipPath></defs><rect width="1100" height="762" fill="#FFFFFF"/><text x="550.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">SM-2010-3　管湧：最短流徑只算砂層，FS 要和規範比</text><text x="550.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">FS = icr/i = 1.11 只表示平均坡降未達臨界；現行規範要求 1.5／2.0</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="1100" height="640" fill="#F5F7FA"/><rect x="6" y="6" width="1088" height="628" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="550.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">沿壁最短流徑（只在砂層內）→ A 點坡降與砂湧檢核</text><text x="550.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">黏土幾乎不透水：水頭 3 m 全耗在砂層內 3 m 下行＋1 m 上行</text><polygon points="132.00,122.80 470.00,122.80 470.00,226.80 132.00,226.80" fill="rgba(63,74,90,0.22)" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="132.00,226.80 470.00,226.80 470.00,330.80 756.00,330.80 756.00,538.80 132.00,538.80" fill="rgba(180,83,9,0.14)" stroke="none" stroke-width="1" opacity="1.0"/><line x1="470.00" y1="122.80" x2="470.00" y2="382.80" stroke="#3F4A5A" stroke-width="5" stroke-linecap="round" opacity="1.0"/><line x1="132.00" y1="122.80" x2="470.00" y2="122.80" stroke="#3F4A5A" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="470.00" y1="330.80" x2="756.00" y2="330.80" stroke="#3F4A5A" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="132.00" y1="538.80" x2="756.00" y2="538.80" stroke="#6B7684" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><line x1="132.00" y1="174.80" x2="470.00" y2="174.80" stroke="#1D4ED8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="137.20" y="168.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">外側水位 1 m</text><text x="750.80" y="324.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="400">開挖面＝坑內水位 4 m</text><text x="293.20" y="203.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#3F4A5A" text-anchor="middle" dominant-baseline="middle" font-weight="400">黏土（不參與滲流）</text><text x="243.86" y="476.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">砂　γ<tspan dy="3.45" font-size="7.82">sat</tspan><tspan dy="-3.45" font-size="11.5"> = 18 kN/m³</tspan></text><text x="462.00" y="398.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#3F4A5A" text-anchor="end" dominant-baseline="middle" font-weight="400">壁底 5 m</text><line x1="454.40" y1="229.40" x2="454.40" y2="370.20" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round"/><polygon points="454.40,380.20 449.80,370.20 459.00,370.20" fill="#C0392B"/><line x1="454.40" y1="395.80" x2="485.60" y2="395.80" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round" opacity="1.0"/><line x1="454.40" y1="380.20" x2="454.40" y2="395.80" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round" opacity="1.0"/><line x1="485.60" y1="395.80" x2="485.60" y2="344.96" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round"/><polygon points="485.60,334.96 490.20,344.96 481.00,344.96" fill="#C0392B"/><text x="446.60" y="304.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">外側下行 3 m</text><text x="493.40" y="364.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">內側上行 1 m</text><circle cx="485.60" cy="330.80" r="5.5" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><text x="496.00" y="318.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">A</text><rect x="512.0" y="407.6" width="430" height="118" rx="8" fill="#FFFFFFF2" stroke="#C0392B" stroke-width="1.4"/><text x="522.00" y="429.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">Δh = 4 − 1 = 3.0 m，L = 3 + 1 = 4.0 m</text><text x="522.00" y="450.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">i = Δh/L = 0.75，j = iγ<tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> = 7.36 kN/m³（向上）</tspan></text><text x="522.00" y="471.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">i<tspan dy="3.60" font-size="8.16">cr</tspan><tspan dy="-3.60" font-size="12"> = γ'/γ</tspan><tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> = 0.835，FS = i</tspan><tspan dy="3.60" font-size="8.16">cr</tspan><tspan dy="-3.60" font-size="12">/i = 1.11 ＞ 1</tspan></text><text x="522.00" y="492.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">現行規範 8.8.3：式 8.8-3 = 0.56 ＜ 1.5、式 8.8-4 = 1.39 ＜ 2.0</text><text x="522.00" y="513.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">⇒ 不符規範，有管湧（砂湧）之虞</text></g><text x="550.0" y="740" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">把黏土厚度算進流徑會低估坡降；只拿 FS 與 1.0 比，會把不符規範的設計判成安全。</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>