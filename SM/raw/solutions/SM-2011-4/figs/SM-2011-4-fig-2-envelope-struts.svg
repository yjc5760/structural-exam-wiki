33" text-anchor="start" dominant-baseline="middle" font-weight="400">支撐力 = 單寬反力 × s（s = 5 m）</text><text x="636.05" y="456.45" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">S = M<tspan dy="3.45" font-size="7.82">max</tspan><tspan dy="-3.45" font-size="11.5">/σ</tspan><tspan dy="3.45" font-size="7.82">all</tspan><tspan dy="-3.45" font-size="11.5"> ≈ 2.29×10</tspan><tspan dy="-4.60" font-size="7.82">-4</tspan><tspan dy="4.60" font-size="11.5"> m³/m</tspan></text></g><text x="490.0" y="760" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">γH/c 只比 4 大一點：先判型再畫圖；包絡線面積是每延米荷重，支撐力要乘水平間距 5 m。</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>