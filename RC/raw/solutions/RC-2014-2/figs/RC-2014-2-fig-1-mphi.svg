ont-weight="700">開裂：φcr = 0.4923×10<tspan dy="-5.00" font-size="8.5">-5</tspan><tspan dy="5.00" font-size="12.5">，Mcr = 7.10</tspan></text><text x="272.69" y="348.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">彈性極限（εc = 0.00055）：φel = 2.313×10<tspan dy="-5.00" font-size="8.5">-5</tspan><tspan dy="5.00" font-size="12.5">，Mel = 19.43</tspan></text><text x="570.66" y="56.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">標稱強度：φu = 10.70×10<tspan dy="-5.00" font-size="8.5">-5</tspan><tspan dy="5.00" font-size="12.5">，Mn = 53.1</tspan></text><text x="558.10" y="236.37" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">虛線：鋼筋降伏、混凝土非線性（只連端點，非真實曲線）</text></g><text x="470.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">開裂後勁度驟降但還能再承受約 7 倍彎矩；曲率比遠大於彎矩比，代表斷面以變形吸收能量</text></svg>