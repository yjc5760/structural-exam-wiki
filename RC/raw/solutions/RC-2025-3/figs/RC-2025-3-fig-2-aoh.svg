 fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">y1 = 60.73</text><text x="508.57" y="240.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="400">綠實線＝箍筋中心線（Aoh、ph 取這條）</text><text x="508.57" y="264.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">灰虛線＝箍筋外緣與內緣（不取）</text><text x="508.57" y="288.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">Aoh = 30.73 × 60.73 ≈ 1866 cm²、ph = 182.92 cm</text><text x="508.57" y="312.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">Ao = 0.85Aoh ≈ 1586 cm²</text><text x="508.57" y="336.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">Tn = 2Ao·At·fyt/s = 7.52 tf·m</text></g><text x="434.0" y="680" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">外緣或內緣都會讓 Aoh 偏大或偏小；公式前的 2 已代表一圈箍筋的兩肢</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>