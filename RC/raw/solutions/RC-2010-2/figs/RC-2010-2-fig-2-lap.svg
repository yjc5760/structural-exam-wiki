'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="middle" dominant-baseline="middle" font-weight="700">下層柱 D29（彎折伸入）</text><text x="156.92" y="590.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">l<tspan dy="4.05" font-size="9.18">d</tspan><tspan dy="-4.05" font-size="13.5">＝4200/(3.5√280)×2.87/2.5＝82.3 cm</tspan></text><text x="141.85" y="616.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">乙級（全數同斷面搭接）：l<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5">＝1.3 l</tspan><tspan dy="4.05" font-size="9.18">d</tspan><tspan dy="-4.05" font-size="13.5">＝107 cm</tspan></text><text x="280.00" y="640.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="400">搭接段全長 D13 @ 10 cm 圍封（比照圍束區）</text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="548" height="648" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">㈠ 規範要求的「面積」是縱筋比</text><text x="101.16" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">§18.4.4.1：0.01A<tspan dy="3.75" font-size="8.5">g</tspan><tspan dy="-3.75" font-size="12.5"> ≤ A</tspan><tspan dy="3.75" font-size="8.5">st</tspan><tspan dy="-3.75" font-size="12.5"> ≤ 0.06A</tspan><tspan dy="3.75" font-size="8.5">g</tspan><tspan dy="-3.75" font-size="12.5">；柱沒有「同斷面搭接 ≤ 50%」</tspan></text><rect x="120" y="190" width="168.56365714285715" height="36" rx="6" fill="#3F4A5A" stroke="none" stroke-width="1"/><text x="110.00" y="208.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#3F4A5A" text-anchor="end" dominant-baseline="middle" font-weight="700">每組 12-D29</text><text x="296.56" y="208.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">3.1%</text><rect x="120" y="300" width="337.1273142857143" height="36" rx="6" fill="#C0392B" stroke="none" stroke-width="1"/><text x="110.00" y="318.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">搭接段兩組並排</text><text x="465.13" y="318.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">6.2%</text><line x1="174.29" y1="165.00" x2="174.29" y2="380.00" stroke="#2E7D6F" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="174.29" y="148.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">1%</text><line x1="445.71" y1="165.00" x2="445.71" y2="380.00" stroke="#2E7D6F" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="445.71" y="148.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">6%</text><text x="118.62" y="450.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">6% 上限針對 A<tspan dy="3.90" font-size="8.84">st</tspan><tspan dy="-3.90" font-size="13">；搭接段鋼筋加倍，須檢討淨間距與澆置</tspan></text><text x="280.00" y="616.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">搭接比例只影響甲／乙級，不是「超過 50% 就要改機械續接」</text></g><text x="560.0" y="760" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">搭接只能在柱中段 l_n/2，拉力搭接；淨高考卷未給，左圖淨高為示意</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>