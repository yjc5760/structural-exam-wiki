<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" xmlns:c2pa="http://c2pa.org/manifest"><rect x="6" y="6" width="888" height="388" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="450.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">淨拉應變 εt 落在哪一段？</text><text x="450.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">土木401-100：非預力撓曲構材 εt ≥ 0.004</text><polygon points="90.00,250.00 171.59,250.00 171.59,182.00 90.00,182.00" fill="rgba(29,78,216,0.16)" stroke="#1D4ED8" stroke-width="1.6" opacity="1.0"/><text x="130.79" y="216.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">壓力控制</text><polygon points="171.59,250.00 455.00,250.00 455.00,182.00 171.59,182.00" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/><text x="313.29" y="216.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">梁不得使用（εt 小於 0.004）</text><polygon points="455.00,250.00 601.00,250.00 601.00,182.00 455.00,182.00" fill="rgba(180,83,9,0.16)" stroke="#B45309" stroke-width="1.6" opacity="1.0"/><text x="528.00" y="216.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">過渡區・梁可用</text><polygon points="601.00,250.00 820.00,250.00 820.00,182.00 601.00,182.00" fill="rgba(46,125,111,0.16)" stroke="#2E7D6F" stroke-width="1.6" opacity="1.0"/><text x="710.50" y="216.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">拉力控制 φ = 0.90</text><line x1="171.59" y1="250.00" x2="171.59" y2="182.00" stroke="#1F2733" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="134.67" y="272.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ε<tspan dy="3.75" font-size="8.5">ty</tspan><tspan dy="-3.75" font-size="12.5">=0.002059</tspan></text><line x1="455.00" y1="250.00" x2="455.00" y2="182.00" stroke="#1F2733" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="455.00" y="272.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">0.004</text><line x1="601.00" y1="250.00" x2="601.00" y2="182.00" stroke="#1F2733" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="601.00" y="272.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">0.005</text><line x1="90.00" y1="250.00" x2="820.00" y2="250.00" stroke="#6B7684" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><line x1="273.29" y1="127.60" x2="273.29" y2="166.92" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="273.29,177.92 268.23,166.92 278.35,166.92" fill="#C0392B"/><text x="214.53" y="111.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">本題 ε<tspan dy="4.20" font-size="9.52">t</tspan><tspan dy="-4.20" font-size="14"> = 0.002755</tspan></text><text x="188.20" y="89.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">（A<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 0.9A</tspan><tspan dy="3.75" font-size="8.5">sb</tspan><tspan dy="-3.75" font-size="12.5">，c</tspan><tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = 52.13 cm）</tspan></text><text x="450.00" y="304.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">φ = 0.65 + 0.25 × (εt − εty)/(0.005 − εty) = 0.7092　　不是 0.90（差 27%）</text><text x="450.00" y="332.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">εt = 0.002755 小於 0.004 → 規範上此斷面不得作為梁；μφ = 1.52 正是這件事的量化證據</text><text x="450.00" y="360.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">「As 小於 Asb」不等於合法 —— 算完 εt 一律順手比 0.004</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>