to Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">d = h - d' = 85 - 9 = 76 cm</text><text x="501.53" y="150.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">考卷 76 cm 量到底層筋形心＝d，不是梁全深；</text><text x="501.53" y="172.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">h = 85 為假設（底筋形心至底面取 9 cm），</text><text x="501.53" y="194.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">頂筋受拉 d = 85 - 9 = 76 cm，兩向相同</text><text x="501.53" y="228.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">A<tspan dy="4.35" font-size="9.86">v</tspan><tspan dy="-4.35" font-size="14.5"> = 4 × 1.27 = 5.08 cm</tspan><tspan dy="-5.80" font-size="9.86">2</tspan></text><text x="501.53" y="250.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">密箍區 4 腳 = 外箍 2 腳 + 繫筋 2 腳</text><text x="501.53" y="272.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">只算外箍 → 2.54 cm<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">，A</tspan><tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> 少一半</tspan></text><text x="501.53" y="306.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">頂 8-D32：A<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = 65.12 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan></text><text x="501.53" y="328.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">底 6-D32：A<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = 48.84 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan></text><text x="501.53" y="350.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">頂筋中心距 6.61 cm（單排放得下）</text><text x="501.53" y="384.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">一般區改用 2 腳：A<tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> = 2.54 cm</tspan><tspan dy="-5.00" font-size="8.5">2</tspan></text><text x="390.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">紅＝頂層 8-D32（負彎矩受拉）　藍＝底層 6-D32　紅框＝D13 閉合箍與繫筋（①～④ 共 4 腳）</text></svg>