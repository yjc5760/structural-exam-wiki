 points="90.00,358.00 98.00,361.20 98.00,354.80" fill="#8A94A6"/><polygon points="225.11,358.00 217.11,354.80 217.11,361.20" fill="#8A94A6"/><text x="157.56" y="373.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">2d = 152 cm</text><text x="237.11" y="358.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">用 2d = 152 cm 是錯的（短了 18 cm）</text><text x="165.56" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">4 腳 D13@15（12 支）</text><text x="814.44" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">4 腳 D13@15（12 支）</text><text x="490.00" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">2 腳 D13@20　（s ≤ d/2 = 38 cm ✓）</text><text x="85.52" y="448.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">密箍區長度以「全高 h」計：2h = 170 cm；密箍區間距 s<tspan dy="3.90" font-size="8.84">o</tspan><tspan dy="-3.90" font-size="13"> = min(d/4 = 19.00, 6d</tspan><tspan dy="3.90" font-size="8.84">b</tspan><tspan dy="-3.90" font-size="13"> = 19.32, 15) = 15 cm，與強度需求 15.47 cm 取小 → 採 15 cm</tspan></text><text x="181.68" y="472.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">耐震「梁」第一支箍距柱面 ≤ 5 cm（§18.6.4.4）；s<tspan dy="3.90" font-size="8.84">o</tspan><tspan dy="-3.90" font-size="13">/2 = 7.5 cm 是「柱」的規定（§18.7.5.3），不可混用</tspan></text><text x="190.62" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">一般區需求 V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 24.92 tf → s ≤ 21.69 cm，採 20 cm 貫通至跨中；紅＝4 腳（V</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> = 0）　藍＝2 腳（可計入 V</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5">）</tspan></text></svg>