<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="642" viewBox="0 0 1140 642"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="380" height="520"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="380" height="520"/></clipPath><clipPath id="sdclip2"><rect x="0" y="0" width="380" height="520"/></clipPath></defs><rect width="1140" height="642" fill="#FFFFFF"/><text x="570.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　My = 144.6、Mp = 256 tf·cm，形狀因子 1.77</text><text x="570.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">彈性看形心（ENA 3.5 cm），塑性看面積平分（PNA 4.0 cm）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="368" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="190.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(a) 斷面：ENA ≠ PNA</text><text x="190.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">上下不對稱，兩軸相差 0.5 cm</text><polygon points="268.00,430.00 268.00,354.00 192.00,354.00 192.00,278.00 268.00,278.00 268.00,202.00 192.00,202.00 192.00,126.00 116.00,126.00 116.00,202.00 40.00,202.00 40.00,278.00 116.00,278.00 116.00,354.00 40.00,354.00 40.00,430.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><line x1="17.20" y1="297.00" x2="290.80" y2="297.00" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="296.80" y="301.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">ENA 3.5</text><line x1="17.20" y1="278.00" x2="290.80" y2="278.00" stroke="#2E7D6F" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="296.80" y="282.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">PNA 4.0</text><text x="154.00" y="112.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">頂緣距 ENA 4.5 cm（大於底緣 3.5，控制 S）</text><text x="154.00" y="464.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">A = 32 cm²，A/2 = 16</text></g><g transform="translate(380,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="368" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="190.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(b) 降伏力矩 My：應力線性</text><text x="190.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">以 ENA 為零點，頂緣（離軸較遠）先達 Fy</text><line x1="211.00" y1="430.00" x2="211.00" y2="126.00" stroke="#3F4A5A" stroke-width="2.0" stroke-linecap="butt" opacity="1.0"/><polygon points="211.00,297.00 211.00,126.00 119.80,126.00" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="1.6" opacity="1.0"/><polygon points="211.00,297.00 211.00,430.00 281.93,430.00" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/><text x="119.80" y="114.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">Fy = 4.0（壓）</text><text x="281.93" y="452.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">3.11（拉）</text><line x1="165.40" y1="297.00" x2="256.60" y2="297.00" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="260.60" y="301.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">ENA 3.5</text><text x="211.00" y="486.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">My = Fy × S = 144.6 tf·cm</text></g><g transform="translate(760,76)" clip-path="url(#sdclip2)"><rect x="6" y="6" width="368" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="190.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(c) 塑性力矩 Mp：應力塊</text><text x="190.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">以 PNA 平分面積，上壓下拉各 A/2</text><line x1="211.00" y1="430.00" x2="211.00" y2="126.00" stroke="#3F4A5A" stroke-width="2.0" stroke-linecap="butt" opacity="1.0"/><polygon points="211.00,278.00 211.00,126.00 119.80,126.00 119.80,278.00" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="1.6" opacity="1.0"/><polygon points="211.00,278.00 211.00,430.00 302.20,430.00 302.20,278.00" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/><line x1="218.60" y1="221.00" x2="121.20" y2="221.00" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round"/><polygon points="112.20,221.00 121.20,216.86 121.20,225.14" fill="#1D4ED8"/><line x1="203.40" y1="373.00" x2="300.80" y2="373.00" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round"/><polygon points="309.80,373.00 300.80,377.14 300.80,368.86" fill="#C0392B"/><text x="224.60" y="225.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">C = 64 tf</text><text x="310.20" y="377.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">T = 64 tf</text><line x1="165.40" y1="278.00" x2="256.60" y2="278.00" stroke="#2E7D6F" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="313.80" y="282.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="400">PNA 4.0</text><line x1="85.60" y1="373.00" x2="85.60" y2="373.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="85.60" y1="221.00" x2="85.60" y2="221.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="85.60" y1="373.00" x2="85.60" y2="221.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="85.60,373.00 88.80,365.00 82.40,365.00" fill="#8A94A6"/><polygon points="85.60,221.00 82.40,229.00 88.80,229.00" fill="#8A94A6"/><text x="69.60" y="297.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">4.0</text><text x="211.00" y="486.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">Mp = 64 × 4.0 = 256 tf·cm</text></g><text x="570.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">I = 162.67 cm⁴、S = I / 4.5 = 36.15 cm³；Z = 40 + 24 = 64 cm³</text></svg>