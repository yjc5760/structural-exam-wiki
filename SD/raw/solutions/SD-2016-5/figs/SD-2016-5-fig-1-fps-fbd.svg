troke="#3F4A5A" stroke-width="2" opacity="1.0"/><line x1="457.51" y1="396.40" x2="457.51" y2="525.00" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="457.51,535.00 452.91,525.00 462.11,525.00" fill="#C0392B"/><text x="467.51" y="541.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">W = mg</text><line x1="457.51" y1="396.40" x2="399.87" y2="266.93" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="395.80,257.80 404.07,265.06 395.67,268.80" fill="#1D4ED8"/><text x="414.66" y="335.10" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="400" font-style="italic">N = W/cosθ</text><line x1="457.51" y1="257.80" x2="405.80" y2="257.80" stroke="#B45309" stroke-width="2.8" stroke-linecap="round"/><polygon points="395.80,257.80 405.80,253.20 405.80,262.40" fill="#B45309"/><line x1="457.51" y1="396.40" x2="457.51" y2="257.80" stroke="#1D4ED8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="395.80" y1="257.80" x2="395.80" y2="257.80" stroke="#1D4ED8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><text x="387.80" y="255.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="400">回復力 N sinθ = W tanθ</text><line x1="330.00" y1="482.90" x2="330.00" y2="482.90" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="464.22" y1="482.90" x2="464.22" y2="482.90" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="330.00" y1="482.90" x2="464.22" y2="482.90" stroke="#8A94A6" stroke-width="1.2"/><polygon points="330.00,482.90 338.00,486.10 338.00,479.70" fill="#8A94A6"/><polygon points="464.22,482.90 456.22,479.70 456.22,486.10" fill="#8A94A6"/><text x="397.11" y="495.90" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">x = r sinθ</text><text x="699.60" y="136.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">忽略摩擦、小角度（sinθ ≈ tanθ ≈ x/r）：</text><text x="699.60" y="176.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">水平：m·x'' = −N sinθ = −W tanθ ≈ −(W/r)x</text><text x="699.60" y="215.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">側向勁度 k = W/r</text><text x="699.60" y="255.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">ω<tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> = k/m = (W/r)/(W/g) = g/r</tspan></text><text x="699.60" y="294.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">T = 2π(r/g)<tspan dy="-5.40" font-size="9.18">1/2</tspan><tspan dy="5.40" font-size="13.5">，與 W（質量）無關</tspan></text></g><text x="620.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">θ 為示意角度；推導用小角度近似，週期只由球面半徑 r 決定</text></svg>